services:
  - type: web
    name: kitchensync
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: KITCHENSYNC_DB_PATH
        value: /tmp/kitchensync.db
